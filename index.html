    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        /* Custom slide animation for the Hero banner */
        .slide-container {
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .slide-item {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
        }
        .slide-hidden-right {
            transform: translateX(100%);
            opacity: 0;
            position: absolute;
        }
        .slide-hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            position: absolute;
        }
        .slide-visible {
            transform: translateX(0);
            opacity: 1;
            position: relative;
        }

        /* Intersection Observer Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
